# Kitty is kept as a terminal emulator only; tmux owns multiplexing, panes,
# tabs, and their key bindings.

font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.5

# Match the Alacritty window spacing as closely as Kitty permits.
window_padding_width 15
background_opacity   0.95
# Applies where the desktop compositor supports Kitty background blur.
background_blur      64
hide_window_decorations no

scrollback_lines        5000
wheel_scroll_multiplier 10.0
mouse_hide_wait         3.0
copy_on_select          clipboard

cursor_shape          block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

enable_audio_bell no
term              xterm-kitty

# Let tmux be the only tab and pane UI. This also passes Kitty's default
# shortcuts through to tmux and terminal applications, including Ctrl-a.
tab_bar_style hidden
clear_all_shortcuts yes
map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard
map --allow-fallback=shifted,ascii ctrl+shift+v paste_from_clipboard

